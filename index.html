<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1f1c18">
    <title>Buggy Service | The Ritz-Carlton, Koh Samui</title>
    <style>
      :root { --ink: #1f1c18; --paper: #ffffff; --gold: #a5834a; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: var(--paper); color: var(--ink); font-family: Georgia, 'Times New Roman', serif; }
      main { width: min(100%, 480px); min-height: 100svh; padding: 42px 28px 34px; display: flex; flex-direction: column; align-items: center; text-align: center; }
      .logo { display: block; width: min(100%, 340px); height: auto; }
      .rule { width: 58px; height: 1px; background: var(--gold); border: 0; margin: 34px 0 32px; }
      h1 { margin: 0; font-size: clamp(30px, 8vw, 40px); font-weight: 400; }
      .intro { margin: 17px 0 32px; font-family: Arial, sans-serif; font-size: 16px; line-height: 1.55; color: #504a42; }
      .buggy { font-size: 42px; margin-bottom: 19px; }
      .button { width: 100%; display: block; border: 0; border-radius: 4px; background: #285b45; color: white; padding: 19px 20px; font-family: Arial, sans-serif; font-size: 16px; font-weight: 700; letter-spacing: .02em; text-decoration: none; box-shadow: 0 7px 18px #1a37291f; }
      .hint { margin: 17px 0 0; font-family: Arial, sans-serif; font-size: 12px; line-height: 1.45; color: #6b655d; }
      footer { margin-top: auto; padding-top: 48px; font-family: Arial, sans-serif; font-size: 11px; letter-spacing: .08em; color: #756e64; }
    </style>
  </head>
  <body>
    <main>
      <img class="logo" src="ritz-carlton-koh-samui-logo.jpg" alt="The Ritz-Carlton, Koh Samui">
      <hr class="rule">
      <div class="buggy" aria-hidden="true">&#128762;</div>
      <h1>Buggy Service</h1>
      <p class="intro">Wherever you are in the resort, our team is ready to assist with your buggy request.</p>
      <a class="button" href="https://wa.me/66622454910?text=Hello%21%20I%20would%20like%20to%20request%20a%20buggy%20service.%20My%20room%2Flocation%20is%3A%20">Request a Buggy service on WhatsApp</a>
      <p class="hint">Please include Room number, Total person &amp; Current location - Destination</p>
      <footer>THE RITZ-CARLTON, KOH SAMUI</footer>
    </main>
  </body>
</html>
